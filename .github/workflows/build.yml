name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read plugin metadata
        id: meta
        run: |
          VERSION="$(sed -nE 's/^version = "([^"]+)"/\1/p' build.gradle.kts)"
          test -n "$VERSION"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "jar_path=build/libs/FemMobs-${VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Verify JAR exists
        run: |
          test -f "${{ steps.meta.outputs.jar_path }}"
          ls -lh "${{ steps.meta.outputs.jar_path }}"

      - name: Upload plugin JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: FemMobs-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
          path: ${{ steps.meta.outputs.jar_path }}
          retention-days: 30
          if-no-files-found: error

      # A release is created once per version: bump `version` in build.gradle.kts to publish a new one.
      - name: Publish GitHub Release on new version
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          JAR_PATH: ${{ steps.meta.outputs.jar_path }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping release creation."
            exit 0
          fi
          # Release notes: the commit messages since the previous release, without attribution lines.
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          RANGE="${PREVIOUS_TAG:+${PREVIOUS_TAG}..}HEAD"
          git log "$RANGE" --format='### %s%n%n%b' | grep -v '^Co-Authored-By:' > release-notes.md
          gh release create "$TAG" "$JAR_PATH" \
            --target "$GITHUB_SHA" \
            --title "FemMobs ${VERSION}" \
            --notes-file release-notes.md
