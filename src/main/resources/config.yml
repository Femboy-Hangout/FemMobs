# Every profile under `mobs` can be reused in any arena wave, and spawned on its own from
# /femmobs gui -> Spawn mobs or /femmobs spawn <mob>.
# After editing this file, run /femmobs reload.
config-version: 5

# Safety limit: reload fails if any wave would spawn more than this many mobs (1 to 500).
# Each mob is scheduled independently for Folia safety, so raise it carefully.
max-mobs-per-wave: 100

spawn-menu:
  # How many blocks in front of you mobs appear when spawned from the menu or /femmobs spawn (1 to 16).
  distance: 3.0

mobs:
  grunt:
    # Bukkit EntityType, for example ZOMBIE, SKELETON, or WITHER_SKELETON.
    entity-type: ZOMBIE
    name: "Forsaken Grunt"
    # Use a named Adventure color (gold, dark_red, gray, etc.) or a hex color such as '#ff8800'.
    name-color: dark_gray
    name-visible: true
    # Optional item shown in the spawn menu. Defaults to the entity's spawn egg.
    # icon: ZOMBIE_HEAD
    # true: never despawns naturally and is saved with the chunk. Arena wave mobs never despawn either way.
    persistent: true
    # Optional: true spawns the baby form for mobs that have one. Defaults to false (always adult).
    # baby: false
    # These exact scoreboard tags are read by FemItems for custom drops.
    scoreboard-tags:
      - forsaken.grunt
    # Any attributes supported by this entity can be listed here. Keys are Attribute names
    # with hyphens or underscores, e.g. max-health, attack-damage, movement-speed,
    # armor, armor-toughness, follow-range, knockback-resistance, attack-knockback.
    attributes:
      max-health: 34.0
      attack-damage: 4.5
      movement-speed: 0.25
    # Current health on spawn. Omit this to start at the configured max-health.
    health: 34.0
    # Equipment slots can be omitted, set material to AIR, and customized independently.
    # Enchantment keys are Bukkit enchantment names; levels may exceed normal limits.
    # drop-chance is 0.0 to 1.0 and controls vanilla equipment drops only.
    equipment:
      main-hand:
        material: IRON_SWORD
        amount: 1
        enchantments:
          sharpness: 2
        drop-chance: 0.0
      off-hand:
        material: AIR
        drop-chance: 0.0
      helmet:
        material: IRON_HELMET
        enchantments: { protection: 2 }
        drop-chance: 0.0
      chestplate:
        material: IRON_CHESTPLATE
        enchantments: { protection: 2 }
        drop-chance: 0.0
      leggings:
        material: IRON_LEGGINGS
        enchantments: { protection: 2 }
        drop-chance: 0.0
      boots:
        material: IRON_BOOTS
        enchantments: { protection: 2 }
        drop-chance: 0.0
    effects: []

  archer:
    entity-type: SKELETON
    name: "Forsaken Archer"
    name-color: green
    name-visible: true
    persistent: true
    scoreboard-tags: [forsaken.archer]
    attributes:
      max-health: 26.0
      movement-speed: 0.24
    health: 26.0
    equipment:
      main-hand:
        material: BOW
        enchantments: { power: 2, punch: 1 }
        drop-chance: 0.0
      helmet:
        material: CHAINMAIL_HELMET
        enchantments: { protection: 2 }
        drop-chance: 0.0
      chestplate:
        material: CHAINMAIL_CHESTPLATE
        enchantments: { protection: 2 }
        drop-chance: 0.0
      leggings:
        material: CHAINMAIL_LEGGINGS
        enchantments: { protection: 2 }
        drop-chance: 0.0
      boots:
        material: CHAINMAIL_BOOTS
        enchantments: { protection: 2 }
        drop-chance: 0.0
    effects: []

  ravager:
    entity-type: VINDICATOR
    name: "Forsaken Ravager"
    name-color: dark_red
    name-visible: true
    persistent: true
    scoreboard-tags: [forsaken.ravager]
    attributes:
      max-health: 55.0
      attack-damage: 8.5
      movement-speed: 0.26
    health: 55.0
    equipment:
      main-hand:
        material: DIAMOND_AXE
        enchantments: { sharpness: 2 }
        drop-chance: 0.0
      helmet:
        material: IRON_HELMET
        enchantments: { protection: 2 }
        drop-chance: 0.0
      chestplate:
        material: IRON_CHESTPLATE
        enchantments: { protection: 2 }
        drop-chance: 0.0
      leggings:
        material: IRON_LEGGINGS
        enchantments: { protection: 2 }
        drop-chance: 0.0
      boots:
        material: IRON_BOOTS
        enchantments: { protection: 2 }
        drop-chance: 0.0
    effects: []

  dreadbound:
    entity-type: HUSK
    name: "The Dreadbound"
    name-color: dark_purple
    name-visible: true
    persistent: true
    scoreboard-tags: [forsaken.dreadbound]
    attributes:
      max-health: 94.0
      attack-damage: 7.0
      movement-speed: 0.27
    health: 94.0
    equipment:
      main-hand:
        material: DIAMOND_SWORD
        enchantments: { sharpness: 3 }
        drop-chance: 0.0
      helmet:
        material: DIAMOND_HELMET
        enchantments: { protection: 2 }
        drop-chance: 0.0
      chestplate:
        material: DIAMOND_CHESTPLATE
        enchantments: { protection: 2 }
        drop-chance: 0.0
      leggings:
        material: DIAMOND_LEGGINGS
        enchantments: { protection: 2 }
        drop-chance: 0.0
      boots:
        material: DIAMOND_BOOTS
        enchantments: { protection: 2 }
        drop-chance: 0.0
    effects:
      - type: STRENGTH
        amplifier: 0
        duration-seconds: -1 # -1 means infinite.
        ambient: false
        particles: false
        icon: false

  champion:
    entity-type: WITHER_SKELETON
    name: "The Forsaken Champion"
    name-color: gold
    name-visible: true
    persistent: true
    scoreboard-tags: [forsaken.champion]
    attributes:
      max-health: 215.0
      attack-damage: 10.5
      movement-speed: 0.28
      knockback-resistance: 0.5
    health: 215.0
    equipment:
      main-hand:
        material: DIAMOND_SWORD
        drop-chance: 0.0
      helmet:
        material: DIAMOND_HELMET
        drop-chance: 0.0
      chestplate:
        material: DIAMOND_CHESTPLATE
        drop-chance: 0.0
      leggings:
        material: DIAMOND_LEGGINGS
        drop-chance: 0.0
      boots:
        material: DIAMOND_BOOTS
        drop-chance: 0.0
    effects:
      - type: RESISTANCE
        amplifier: 0
        duration-seconds: -1
        ambient: false
        particles: false
        icon: false

  # ------------------------------------------------------------------ bosses
  # A `boss:` section gives a mob abilities, particles, its own health bar and a death announcement.
  # Ability types: slam, fireball, aura, summon, teleport, lightning. Common options:
  #   cooldown (seconds), below-health (only below this % health; default 100 = always),
  #   range (how far its target may be), radius (area size), damage, power, fire-seconds,
  #   effect + level + duration (seconds), summon (mob profile) + count + max-alive,
  #   min-range (fireball: only at targets at least this far), message (action bar for nearby players).
  # Looks: scale (attribute) makes it bigger; armor can have `trim: { material, pattern }` and leather a
  # `color: '#RRGGBB'`; blocks can be worn as helmets; glow-color colors the glowing outline (Paper only).
  molten_warden:
    entity-type: HUSK
    name: "The Molten Warden"
    name-color: gold
    name-visible: true
    persistent: true
    glowing: true
    glow-color: gold
    scoreboard-tags: [forsaken.molten_warden]
    attributes:
      max-health: 260.0
      attack-damage: 9.0
      movement-speed: 0.25
      knockback-resistance: 0.8
      armor: 6.0
      scale: 1.5
    health: 260.0
    equipment:
      main-hand:
        material: MACE
        drop-chance: 0.0
      helmet:
        material: MAGMA_BLOCK
        drop-chance: 0.0
      chestplate:
        material: NETHERITE_CHESTPLATE
        trim: { material: gold, pattern: rib }
        drop-chance: 0.0
      leggings:
        material: NETHERITE_LEGGINGS
        trim: { material: gold, pattern: rib }
        drop-chance: 0.0
      boots:
        material: NETHERITE_BOOTS
        trim: { material: gold, pattern: rib }
        drop-chance: 0.0
    effects:
      - { type: FIRE_RESISTANCE, amplifier: 0, duration-seconds: -1 }
    boss:
      health-bar: RED
      particle: FLAME
      particle-count: 4
      death-message: "<gold>🔥 <yellow><killer></yellow> struck the final blow on <bold><mob></bold>!"
      abilities:
        - { type: slam, cooldown: 9, radius: 5, damage: 7, power: 1.0, fire-seconds: 4, message: "<gold><mob> slams the ground!" }
        - { type: fireball, cooldown: 6, range: 20, min-range: 6, count: 3 }
        - { type: aura, cooldown: 4, below-health: 50, radius: 4, fire-seconds: 3, damage: 2 }
        - { type: summon, cooldown: 25, below-health: 50, summon: molten_spawn, count: 2, max-alive: 4, radius: 4, message: "<gold><mob> calls magma from the ground!" }

  molten_spawn:
    entity-type: MAGMA_CUBE
    name: "Molten Spawn"
    name-color: red
    name-visible: false
    persistent: true
    slime-size: 2
    scoreboard-tags: [forsaken.molten_spawn]
    attributes:
      max-health: 16.0
      attack-damage: 4.0
    health: 16.0
    effects: []

  cosmic_wraith:
    entity-type: WITHER_SKELETON
    name: "The Cosmic Wraith"
    name-color: light_purple
    name-visible: true
    persistent: true
    glowing: true
    glow-color: dark_purple
    scoreboard-tags: [forsaken.cosmic_wraith]
    attributes:
      max-health: 230.0
      attack-damage: 8.0
      movement-speed: 0.3
      knockback-resistance: 0.4
      armor: 8.0
      scale: 1.25
    health: 230.0
    equipment:
      main-hand:
        material: NETHERITE_SWORD
        drop-chance: 0.0
      helmet:
        material: PURPLE_STAINED_GLASS
        drop-chance: 0.0
      chestplate:
        material: LEATHER_CHESTPLATE
        color: '#2a0a4a'
        trim: { material: amethyst, pattern: spire }
        drop-chance: 0.0
      leggings:
        material: LEATHER_LEGGINGS
        color: '#2a0a4a'
        trim: { material: amethyst, pattern: spire }
        drop-chance: 0.0
      boots:
        material: LEATHER_BOOTS
        color: '#2a0a4a'
        trim: { material: amethyst, pattern: spire }
        drop-chance: 0.0
    effects: []
    boss:
      health-bar: PURPLE
      particle: END_ROD
      particle-count: 3
      death-message: "<light_purple>✦ <yellow><killer></yellow> banished <bold><mob></bold> back to the void!"
      abilities:
        - { type: teleport, cooldown: 8, range: 16, message: "<light_purple><mob> vanishes...</light_purple>" }
        - { type: aura, cooldown: 12, radius: 6, effect: blindness, duration: 2 }
        - { type: lightning, cooldown: 10, range: 18, damage: 5 }
        - { type: aura, cooldown: 15, below-health: 60, radius: 6, effect: levitation, level: 1, duration: 1.5, message: "<light_purple>Gravity bends around <mob>!" }
        - { type: summon, cooldown: 30, below-health: 30, summon: cosmic_shade, count: 2, max-alive: 2, radius: 3, message: "<light_purple><mob> splits into shadows!" }

  cosmic_shade:
    entity-type: WITHER_SKELETON
    name: "Cosmic Shade"
    name-color: dark_purple
    name-visible: true
    persistent: true
    glowing: true
    glow-color: dark_purple
    scoreboard-tags: [forsaken.cosmic_shade]
    attributes:
      max-health: 30.0
      attack-damage: 5.0
      movement-speed: 0.32
      scale: 0.9
    health: 30.0
    equipment:
      main-hand:
        material: STONE_SWORD
        drop-chance: 0.0
      helmet:
        material: BLACK_STAINED_GLASS
        drop-chance: 0.0
    effects:
      - { type: INVISIBILITY, amplifier: 0, duration-seconds: -1 }

# Each key under `arenas` is an arena (or any other spawn area). Arenas are listed in the menu,
# can run at the same time, and each has its own waves. Start one with /femmobs start <arena>.
arenas:
  forsaken:
    name: "Forsaken Arena"
    description: "Five waves of the Forsaken." # Optional; shown in the arena list.
    icon: NETHER_STAR # Optional item shown in the arena list.
    # Exact Bukkit world name where this arena's coordinates are located.
    world: world
    # Default campaign pause after a wave is cleared. A wave can override it below.
    wave-delay-seconds: 5
    # Each wave contains display text, an optional next-wave delay, and spawn groups.
    # Coordinates are world coordinates. amount spawns copies at that point. spread distributes
    # copies randomly in a circle around the point. yaw/pitch set the mob's initial facing.
    waves:
      wave1:
        name: "Opening Patrol"
        description: "Two grunts and an archer." # Optional extra line in the wave menu.
        delay-after-seconds: 5 # Optional; omitted uses the arena's wave-delay-seconds.
        spawns:
          - { profile: grunt, x: 106.5, y: 75, z: -2787.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: grunt, x: 112.5, y: 75, z: -2787.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: archer, x: 109.5, y: 75, z: -2791.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
      wave2:
        name: "Crossfire"
        description: "Grunts hold the arena while archers cover the ravager."
        delay-after-seconds: 5
        spawns:
          - { profile: grunt, x: 105.5, y: 75, z: -2787.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: grunt, x: 113.5, y: 75, z: -2787.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: archer, x: 106.5, y: 75, z: -2790.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: archer, x: 112.5, y: 75, z: -2784.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: ravager, x: 109.5, y: 75, z: -2787.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
      wave3:
        name: "Heavy Fighters"
        description: "Dreadbound, ravagers, and two archers."
        delay-after-seconds: 5
        spawns:
          - { profile: dreadbound, x: 106.5, y: 75, z: -2790.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: dreadbound, x: 112.5, y: 75, z: -2784.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: ravager, x: 106.5, y: 75, z: -2784.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: ravager, x: 112.5, y: 75, z: -2790.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: archer, x: 109.5, y: 75, z: -2791.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: archer, x: 109.5, y: 75, z: -2783.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
      wave4:
        name: "Final Assault"
        description: "The main force attacks from every side."
        delay-after-seconds: 5
        spawns:
          - { profile: dreadbound, x: 105.5, y: 75, z: -2787.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: dreadbound, x: 113.5, y: 75, z: -2787.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: dreadbound, x: 109.5, y: 75, z: -2791.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: ravager, x: 106.5, y: 75, z: -2790.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: ravager, x: 112.5, y: 75, z: -2784.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: archer, x: 109.5, y: 75, z: -2783.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: archer, x: 106.5, y: 75, z: -2784.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
          - { profile: archer, x: 112.5, y: 75, z: -2790.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }
      wave5:
        name: "Champion"
        description: "The champion enters alone."
        delay-after-seconds: 5
        spawns:
          - { profile: champion, x: 109.5, y: 75, z: -2787.5, amount: 1, yaw: 0, pitch: 0, spread: 0 }

# Server events: start one where you stand with /femmobs event start <event> <radius>, or from
# /femmobs gui -> Events. Mobs spawn on the ground within <radius> blocks of you, the whole server
# is told roughly where, nearby players see a boss bar, and leftover mobs are removed when time runs out.
# Largest radius allowed when starting an event (blocks).
max-event-radius: 200
events:
  invasion:
    name: "Forsaken Invasion"
    icon: IRON_SWORD
    # fixed: spawn `mobs` once; the event ends early when they are all killed.
    # keep-population: keep about `mobs` alive, replacing killed ones every `respawn-seconds`.
    mode: fixed
    mobs: 30
    respawn-seconds: 5
    duration-seconds: 600
    # Which mob profiles spawn. Two ways (pick one per event):
    #   weight: each mob is picked at random; weights are relative chances (60/30/10 = 60%, 30%, 10%).
    #           `mobs` sets how many spawn.
    #   amount: exact numbers, e.g. always 12 grunts, 6 archers, 2 ravagers. `mobs` is ignored (the total
    #           is the sum). In keep-population mode each profile is kept at its exact amount.
    roster:
      - { profile: grunt, weight: 60 }
      - { profile: archer, weight: 30 }
      - { profile: ravager, weight: 10 }
    # Exact-amount example:
    # roster:
    #   - { profile: grunt, amount: 12 }
    #   - { profile: archer, amount: 6 }
    #   - { profile: ravager, amount: 2 }
    # Optional: one extra mob that spawns once at the start. For no boss, remove the line or write: boss: none
    boss: dreadbound
    # Announce how much time is left at these points (seconds remaining).
    warnings-seconds: [300, 60]
    # Boss bar color: PINK, BLUE, RED, GREEN, YELLOW, PURPLE or WHITE.
    boss-bar-color: RED
    # How many top killers the end message lists (0 hides it).
    leaderboard-size: 3
    # Coordinates in messages are rounded to this many blocks, so they give a general area.
    location-rounding: 50
    # Event mobs glow (outline visible through blocks) so players can find them. Default true;
    # set false for an event where the mobs should be hidden.
    glowing: true
    # After the event ends, unclaimed drops from regular mobs vanish after this many seconds (0 = keep).
    # Drops from bosses are never removed.
    drop-cleanup-seconds: 60
    # Optional message overrides in MiniMessage format. Placeholders: <event>, <location>
    # (rounded coordinates and biome), <time> (time left), <mobs> (mobs remaining), <radius>.
    # The leaderboard also has <entries>; each entry has <player> and <kills>.
    # messages:
    #   start: "<gold>⚔ <bold><event></bold></gold> <yellow>has begun around <white><location></white>! <time> to fight them off."
    #   warning: "<gold>⚔ <event>:</gold> <yellow><time> left, <white><mobs></white> mobs remain!"
    #   end-time: "<gray>⚔ <event> is over. The remaining mobs have retreated."
    #   end-cleared: "<green>⚔ <event>: every mob was defeated!"
    #   end-stopped: "<gray>⚔ <event> was stopped."
    #   leaderboard: "<gold>🏆 Top hunters:</gold> <entries>"
    #   leaderboard-entry: "<yellow><player></yellow> <white><kills></white>"
    #   boss-bar: "<gold>⚔ <event></gold> <gray>·</gray> <white><time> left</white> <gray>·</gray> <red><mobs> mobs</red>"

  # The events below use exact amounts. Archer and ravager counts are tuned to feel about as hard as
  # 30 grunts: archers are fragile but shoot from range, ravagers are tanky and hit hard.
  grunt_invasion:
    name: "Grunt Invasion"
    icon: ZOMBIE_HEAD
    mode: fixed
    duration-seconds: 600
    roster:
      - { profile: grunt, amount: 30 }
    boss: none
    warnings-seconds: [300, 60]
    boss-bar-color: WHITE
    leaderboard-size: 3
    glowing: true

  archer_invasion:
    name: "Archer Invasion"
    icon: BOW
    mode: fixed
    duration-seconds: 600
    roster:
      - { profile: archer, amount: 21 }
    boss: none
    warnings-seconds: [300, 60]
    boss-bar-color: GREEN
    leaderboard-size: 3
    glowing: true

  ravager_invasion:
    name: "Ravager Invasion"
    icon: IRON_AXE
    mode: fixed
    duration-seconds: 600
    roster:
      - { profile: ravager, amount: 12 }
    boss: none
    warnings-seconds: [300, 60]
    boss-bar-color: RED
    leaderboard-size: 3
    glowing: true

  # Miniboss battles: the boss spawns once alongside its escort.
  dreadbound_battle:
    name: "The Dreadbound Rises"
    icon: WITHER_ROSE
    mode: fixed
    duration-seconds: 600
    roster:
      - { profile: grunt, amount: 8 }
    boss: dreadbound
    warnings-seconds: [300, 60]
    boss-bar-color: PURPLE
    leaderboard-size: 3
    glowing: true

  champion_battle:
    name: "The Forsaken Champion"
    icon: WITHER_SKELETON_SKULL
    mode: fixed
    duration-seconds: 900
    roster:
      - { profile: ravager, amount: 6 }
    boss: champion
    warnings-seconds: [600, 300, 60]
    boss-bar-color: YELLOW
    leaderboard-size: 3
    glowing: true

  molten_warden_battle:
    name: "The Molten Warden"
    icon: MAGMA_BLOCK
    mode: fixed
    duration-seconds: 900
    roster:
      - { profile: grunt, amount: 6 }
    boss: molten_warden
    warnings-seconds: [600, 300, 60]
    boss-bar-color: RED
    leaderboard-size: 3
    glowing: true

  cosmic_wraith_battle:
    name: "The Cosmic Wraith"
    icon: END_CRYSTAL
    mode: fixed
    duration-seconds: 900
    roster:
      - { profile: archer, amount: 6 }
    boss: cosmic_wraith
    warnings-seconds: [600, 300, 60]
    boss-bar-color: PURPLE
    leaderboard-size: 3
    glowing: true

# Automatic events. When enabled, every `every-minutes` (give or take `random-minutes`) a random event
# from `events` starts at a random spot min-distance to max-distance blocks from center-x/center-z,
# and the announcement gives its exact coordinates. Skipped (retried 5 minutes later) when fewer than
# min-players are online or another event is running. Test it with /femmobs event schedule now.
event-schedule:
  enabled: false
  every-minutes: 180
  random-minutes: 30
  min-players: 3
  world: world
  center-x: 0
  center-z: 0
  min-distance: 200
  max-distance: 500
  radius: 30
  # Relative chances (they don't have to add up to 100). 0 or leaving an event out = never scheduled.
  events:
    grunt_invasion: 35
    archer_invasion: 30
    invasion: 10
    ravager_invasion: 10
    dreadbound_battle: 6
    champion_battle: 4
    molten_warden_battle: 3
    cosmic_wraith_battle: 2
